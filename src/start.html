<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>LuxStage</title>
<style>
  :root { color-scheme: dark; --bg: #18181b; --fg: #f4f4f5; --muted: #a1a1aa; --line: #3f3f46; --accent: #2563eb; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px -apple-system, "Segoe UI", sans-serif; -webkit-app-region: drag; }
  main { width: min(380px, 86vw); -webkit-app-region: no-drag; }
  img { width: 96px; height: 96px; display: block; margin: 0 auto 14px; }
  p.sub { text-align: center; }
  p { color: var(--muted); margin: 0 0 20px; }
  label { display: block; font-size: 13px; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 15px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
  button { margin-top: 14px; width: 100%; padding: 10px; font-size: 15px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  .err { color: #dc2626; font-size: 13px; min-height: 18px; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <p class="sub">Mit welchem Team verbinden?</p>
  <form id="f">
    <label for="team">Team-Name oder Adresse</label>
    <input id="team" autofocus autocomplete="off" placeholder="z. B. mein-theater.luxstage.app">
    <div class="err" id="err"></div>
    <button type="submit">Verbinden</button>
  </form>
</main>
<script>
  const team = document.getElementById('team'), err = document.getElementById('err')
  window.luxstageDesktop.getInfo().then((i) => { if (i.serverUrl) team.value = i.serverUrl })
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault()
    err.textContent = ''
    const r = await window.luxstageDesktop.setServer(team.value)
    if (!r.ok) err.textContent = 'Name oder Adresse ungültig.'
  })
</script>
</body>
</html>
